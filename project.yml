name: ClaudeSwitch
options:
  bundleIdPrefix: com.claudeswitch
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_HARDENED_RUNTIME: false
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  ClaudeSwitch:
    type: application
    platform: macOS
    sources:
      - path: ClaudeSwitch
      - path: Icon/ClaudeSwitch.icon
        type: file
        buildPhase: resources
    info:
      path: ClaudeSwitch/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: ""
        NSAppleEventsUsageDescription: "ClaudeSwitch needs permission to quit and relaunch Claude so it can safely swap the active account's stored session."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.claudeswitch.app
        CODE_SIGN_ENTITLEMENTS: ClaudeSwitch/Resources/ClaudeSwitch.entitlements
        PRODUCT_NAME: ClaudeSwitch
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: ClaudeSwitch
    entitlements:
      path: ClaudeSwitch/Resources/ClaudeSwitch.entitlements
      properties: {}
